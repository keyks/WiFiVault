<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<!-- 尽量让 X5 / QQ 浏览器使用页内 H5 播放器，减少原生播放器/嗅探浮层接管 -->
<meta name="x5-video-player-type" content="h5-page">
<meta name="x5-video-player-fullscreen" content="false">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WiFiVault</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/plyr/plyr.css?v=385">
<link rel="stylesheet" href="/app.css?v=130">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 108 108" class="logo" aria-hidden="true">
      <circle cx="54" cy="54" r="33" />
      <path d="M32.5 42 L40 68 L48 52 L56 68 L63.5 42 L69.8 68 L76 42" />
    </svg>
    <span>WiFiVault</span>
  </div>

  <nav class="crumbs" id="crumbs"></nav>

  <div class="tools">
    <select id="libSelect" class="lib-select" title="切换共享文件夹"></select>
    <input id="search" class="search" type="search" placeholder="搜索当前目录" autocomplete="off">
    <button id="viewToggle" class="icon-btn" title="切换列表/网格视图">▦</button>
  </div>
</header>

<main id="content" class="grid"></main>
<div id="empty" class="empty hidden"></div>
<div id="loading" class="loading hidden">加载中…</div>

<!-- 图片查看器 -->
<div id="lightbox" class="overlay hidden">
  <img id="lbImg" alt="">
  <button class="lb-nav prev" id="lbPrev" aria-label="上一张">‹</button>
  <button class="lb-nav next" id="lbNext" aria-label="下一张">›</button>
  <div class="lb-bar">
    <span id="lbName"></span>
    <div class="lb-actions">
      <button class="icon-btn" id="lbZoomOut" title="缩小">－</button>
      <button class="icon-btn" id="lbZoomIn" title="放大">＋</button>
      <button class="icon-btn" id="lbClose" title="关闭 (Esc)">关闭</button>
    </div>
  </div>
</div>

<!-- 视频播放器：控件由本地内置的 Plyr 提供，选集 / 关闭等使用轻量覆盖层 -->
<div id="player" class="overlay hidden">
  <video id="video" controls playsinline webkit-playsinline x5-playsinline="true"
    x5-video-player-type="h5-page" x5-video-player-fullscreen="false"
    disablepictureinpicture preload="metadata"></video>

  <div class="player-topbar" id="playerTopbar">
    <button class="pt-btn pt-back" id="vClose" title="关闭 (Esc)" aria-label="关闭">‹</button>
    <div class="pt-group">
      <button class="pt-btn" id="vPrev" title="上一个视频 ( [ )" aria-label="上一个视频">⏮</button>
      <button class="pt-btn" id="vNext" title="下一个视频 ( ] )" aria-label="下一个视频">⏭</button>
    </div>
    <span class="v-title" id="vTitle"></span>
    <button class="pt-btn" id="vSub" title="字幕" aria-label="字幕">CC</button>
    <button class="pt-btn pt-list" id="vfList" title="播放目录" aria-label="播放目录">选集</button>
  </div>

  <!-- 视频无法解码 / 网络失败时的兜底 -->
  <div id="playerError" class="player-error hidden">
    <div class="pe-box">
      <div class="pe-title">视频无法播放</div>
      <div class="pe-msg" id="peMsg"></div>
      <div class="pe-actions">
        <button class="primary" id="peExternal">用系统播放器打开</button>
        <button class="icon-btn" id="peRetry">重试</button>
        <button class="icon-btn" id="peClose">关闭</button>
      </div>
    </div>
  </div>

  <div class="hint hidden" id="hint"></div>

  <!-- 播放目录抽屉 -->
  <div id="plPanel" class="pl-panel hidden">
    <div class="pl-head">
      <span>播放目录</span>
      <button class="icon-btn" id="plClose" title="收起">收起</button>
    </div>
    <div class="pl-body" id="plBody"></div>
  </div>
</div>

<!-- 通用文件预览（文档 / 文本 / PDF / 图片 / 其他） -->
<div id="preview" class="overlay hidden">
  <div class="pv-box">
    <div class="pv-top">
      <span id="pvName" class="pv-name"></span>
      <div class="pv-actions">
        <button class="icon-btn" id="pvPrevFile" title="上一个文件">‹</button>
        <button class="icon-btn" id="pvNextFile" title="下一个文件">›</button>
        <button class="icon-btn" id="pvRaw" title="浏览器新窗口打开">打开</button>
        <button class="icon-btn" id="pvDl" title="下载到本机">下载</button>
        <button class="icon-btn" id="pvClose" title="关闭 (Esc)">关闭</button>
      </div>
    </div>
    <div class="pv-body" id="pvBody"></div>
  </div>
</div>

<!-- 音频播放条 -->
<div id="audioBar" class="audio-bar hidden">
  <span id="aName" class="a-name"></span>
  <audio id="audio" controls></audio>
  <button class="icon-btn" id="aClose" title="关闭">✕</button>
</div>

<!-- 访问密码 -->
<div id="pinModal" class="overlay hidden">
  <form class="pin-box" id="pinForm">
    <h2>需要访问密码</h2>
    <p>该共享已设置密码，请输入手机端设置的 PIN。</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <button class="primary" type="submit">进入</button>
    <div id="pinErr" class="pin-err"></div>
  </form>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/vendor/plyr/plyr.polyfilled.min.js?v=385"></script>
<script src="/app.js?v=130"></script>
</body>
</html>
