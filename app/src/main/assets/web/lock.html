<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFiVault · 需要密码</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .box {
    background: #1b222c; border: 1px solid #2a333f; border-radius: 18px;
    padding: 28px; width: min(92vw, 360px); text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 19px; }
  p { margin: 0 0 16px; color: #8b98a5; font-size: 13.5px; }
  input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a333f;
    background: #151b23; color: #e6edf3; text-align: center; letter-spacing: 4px; box-sizing: border-box;
  }
  button {
    margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: #4c8dff; color: #fff; font-weight: 600; cursor: pointer;
  }
  .err { margin-top: 10px; color: #ff7b72; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<form class="box" id="f">
  <h1>需要访问密码</h1>
  <p>该共享已设置密码，请输入手机端设置的 PIN。</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" autofocus>
  <button type="submit">进入</button>
  <div class="err" id="err"></div>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var res = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: document.getElementById('pin').value })
    });
    if (res.ok) location.href = '/';
    else document.getElementById('err').textContent = '密码不正确';
  });
</script>
</body>
</html>
